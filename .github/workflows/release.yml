# Push tag vX.Y.Z -> test, build versioned bundles, publish a GitHub Release with
# the zips + catalog.json. Projects read the catalog from releases/latest/download.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: bash tests/run-tests.sh

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" bash build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes
